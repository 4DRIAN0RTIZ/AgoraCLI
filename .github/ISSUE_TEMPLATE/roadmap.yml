name: Item de roadmap
description: Una entrada del roadmap publico (la consume el widget del portfolio).
title: "[roadmap] "
labels: ["roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        - El primer parrafo del **Resumen** se muestra como texto plano en la web.
        - Cada checkbox de **Tareas** se lista con su estado.
        - Estado: agrega una etiqueta `roadmap:working`, `roadmap:planned` o `roadmap:idea`
          (sin etiqueta = "planeado"). Cierra el issue cuando este hecho.
        - Item activo ("ahora"): etiqueta `roadmap:now` o autoasignate el issue.
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: Que es y por que. La primera linea se muestra en la web.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tareas
      value: |
        - [ ] Primera tarea
        - [ ] Segunda tarea
